{% extends 'base.html' %}
{% load static %}
{% block css %}
    <link rel="stylesheet" href="{% static 'menu/style/style.css' %}">
{% endblock %}

{% block content %}

        <h1>Cadastrar Produto</h1>

        <form method="POST">
            {% csrf_token %}

            <label for="nome">Nome do Produto:</label>
            <input type="text" id="nome" name="nome" value="{{ nome }}" maxlength="100" required>

            {% if erros.nome %}
                <p>{{ erros.nome }}</p>
            {% endif %}

            <label for="preco">Preço do Produto:</label>
            <input type="number" id="preco" name="preco" value="{{ preco }}" step="0.01" min="0.01" required>

            {% if erros.preco %}
                <p>{{ erros.preco }}</p>
            {% endif %}

            <button type="submit">Cadastrar</button>

        </form>

{% endblock %}
