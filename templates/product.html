{% extends 'base.html' %}
{% load static %}
{% block css %}
    <link rel="stylesheet" href="{% static 'menu/style/product.css' %}">
{% endblock %}

{% block content %}

        <section class="page-product">
            <div class="foto-product">
                <img src="{% static 'main/assets/burger-combo.png' %}" alt="Imagem do produto">
            </div>
            <h1>{{ produto.nome }}</h1>
            <h2>R$ {{ produto.preco }}</h2>
            {% if produto.disponibilidade %}
                <h3 class="status-true">Em estoque</h3>
            {% else %}
                <h3 class="status-false">Sem estoque</h3>
            {% endif %}
        </section>

{% endblock %}
